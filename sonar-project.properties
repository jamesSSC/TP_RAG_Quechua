# Estructura real del repositorio (backend/ y frontend/). El token va siempre en la variable de entorno
# SONAR_TOKEN; nunca en este archivo.
# Local (SonarQube Community):  pysonar --sonar-host-url=http://localhost:9000
# SonarQube Cloud: completar sonar.organization y sonar.host.url desde la CI.
sonar.projectKey=omarpiero_rag-quechua-wanka
sonar.projectName=RAG quechua wanka
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.test.jsx
sonar.python.version=3.12

# Cobertura: pytest --cov=src --cov-report=xml (desde backend/); la de la interfaz solo si existe
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Nunca se analizan datos, documentacion, el material de referencia ni artefactos generados
sonar.exclusions=corpus/**,referencia_poc/**,docs/**,backend/data/**,backend/modelos/**,backend/interfaz/**,backend/build/**,backend/dist/**,frontend/dist/**,frontend/e2e/.tmp/**,frontend/node_modules/**,**/__pycache__/**
sonar.coverage.exclusions=backend/tests/**,frontend/src/**/*.test.jsx,frontend/src/test/**,frontend/e2e/**
# En el PMV3 se añadirá app_movil/lib a sonar.sources y el informe lcov de Flutter
